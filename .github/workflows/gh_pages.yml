name: Deploy GH Pages

on:
  push: 
    branches: [ "master" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # checkout
      - uses: actions/checkout@v3

      # build
      - name: npm install 
        uses: actions/setup-node@v4
      - run: npm install

      - name: Build project
      - run: npm run build

      # deploy
      - name: deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist